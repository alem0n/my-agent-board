name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行完整质量门禁
        run: make check
      - name: 分层依赖契约校验
        run: make layers
